  const bd=document.getElementById('mobileMenuBackdrop');
  if(sb) sb.classList.add('mobile-open');
  if(bd) bd.classList.add('show');
}

/* ================= VUE : SECRÉTARIAT ================= */
let secretariatTab='cartes';
function secretariatSubnav(){
  const tabs=[
    ['cartes','🪪','Cartes d’identité scolaire'],['certificats','📜','Certificats de scolarité'],['attestations','📄','Attestations de scolarité'],['travail','👔','Attestations de travail'],
    ['lettres','✉️','Lettres administratives'],['courriers','📬','Courriers — registres arrivée/départ'],['convocations','📣','Convocations'],['pv','📝','Procès-verbaux'],['archivage','🗂️','Archivage'],['agenda','📅','Agenda & réunions'],['taches','✅','Suivi des tâches'],['personnel','👥','Gestion du personnel'],['rapports','📊','Rapports & statistiques']
  ];
  return `<div class="secretSubnav"><div class="subTitle">SECRÉTARIAT</div>${tabs.map(t=>`<button class="${secretariatTab===t[0]?'active':''}" onclick="secretariatTab='${t[0]}';render()"><span>${t[1]}</span><span>${t[2]}</span></button>`).join('')}</div>`;
}
function secretariatDoc(type,title,person=''){
  const ref='SEC-'+new Date().getFullYear()+'-'+String((DB.secretariatDocuments||[]).length+1).padStart(4,'0');
  const date=todayISO();
  return `<div class="card secretDoc" id="secretDocZone"><div style="text-align:center"><h2 style="margin:0">GZ COMPTA</h2><h3>${etab()}</h3>${coordEtab(etab())}<h2>${title}</h2><p><b>Référence :</b> ${ref} — <b>Date :</b> ${date}</p></div><div style="min-height:300px;border:1px solid #aaa;padding:18px">${person?`<p><b>Concerné(e) :</b> ${person}</p>`:''}<p>Document administratif généré par le secrétariat de l'établissement.</p><p style="margin-top:55px">Fait à ${DB.etabInfo[etab()]?.ville||'________________'}, le ${date}</p><div style="display:flex;justify-content:space-between;margin-top:60px"><div>Le secrétariat<br><br>________________</div><div>La Direction<br><br>________________</div></div></div>${printFooter()}</div><div class="toolbar no-print"><button class="btn" onclick="openPrintPreview('secretDocZone')">Aperçu / Imprimer</button></div>`;
}
function viewSecretariat(){
  if(!requireView('secretariat')) return '';
  let html=head('Secrétariat','#315c8f');
  html+=`<div class="secretLayout"><div>${secretariatSubnav()}</div><div class="secretContent">`;
  if(secretariatTab==='cartes') html+=`<div class="card"><h3>🪪 Cartes d’identité scolaire</h3><p class="note">Génération des cartes avec identité, classe, filière, photo et QR de vérification.</p><div class="toolbar"><button class="btn" onclick="genererCarteDemo()">Générer carte de l’apprenant sélectionné</button></div><select id="secStudent">${DB.students.filter(matchScope).map(s=>`<option value="${s.id}">${s.nom} ${s.prenoms} — ${s.filiere} ${s.annee}</option>`).join('')}</select></div><div id="secGenerated"></div>`;
  else if(secretariatTab==='certificats') html+=`<div class="card"><h3>📜 Certificat de scolarité</h3><p>Préparer et imprimer un certificat officiel avec QR Code.</p><select id="secPerson">${DB.students.filter(matchScope).map(s=>`<option>${s.nom} ${s.prenoms}</option>`).join('')}</select><button class="btn" style="margin-top:10px" onclick="document.getElementById('secGenerated').innerHTML=secretariatDoc('certificat','CERTIFICAT DE SCOLARITÉ',document.getElementById('secPerson').value)">Générer</button></div><div id="secGenerated"></div>`;
  else if(secretariatTab==='attestations') html+=`<div class="card"><h3>📄 Attestation de scolarité</h3><select id="secPerson">${DB.students.filter(matchScope).map(s=>`<option>${s.nom} ${s.prenoms}</option>`).join('')}</select><button class="btn" style="margin-top:10px" onclick="document.getElementById('secGenerated').innerHTML=secretariatDoc('attestation','ATTESTATION DE SCOLARITÉ',document.getElementById('secPerson').value)">Générer</button></div><div id="secGenerated"></div>`;
  else if(secretariatTab==='travail') html+=`<div class="card"><h3>👔 Attestation de travail</h3><select id="secPers">${(DB.personnelAdministratif||[]).map(p=>`<option>${p.nom} — ${p.fonction||''}</option>`).join('')}</select><button class="btn" style="margin-top:10px" onclick="document.getElementById('secGenerated').innerHTML=secretariatDoc('travail','ATTESTATION DE TRAVAIL',document.getElementById('secPers').value)">Générer</button></div><div id="secGenerated"></div>`;
  else if(secretariatTab==='lettres') html+=`<div class="card"><h3>✉️ Lettres administratives</h3><div class="grid2"><div><label>Destinataire</label><input id="secDest" placeholder="Nom / organisme"></div><div><label>Objet</label><input id="secObjet" placeholder="Objet de la lettre"></div></div><label>Contenu</label><textarea id="secContenu" rows="8" placeholder="Rédigez la lettre..."></textarea><button class="btn" style="margin-top:10px" onclick="genererLettreSec()">Générer / imprimer</button></div><div id="secGenerated"></div>`;
  else if(secretariatTab==='courriers') html+=`<div class="card"><h3>📬 Courriers — registre arrivée / départ</h3><div class="toolbar"><button class="btn" onclick="ajouterCourrierSec()">+ Nouveau courrier</button><input id="secCourSearch" placeholder="Rechercher référence, objet, expéditeur..." oninput="filtrerTableSec('secCourSearch','secCourTable')"></div><div class="tablewrap"><table id="secCourTable"><tr><th>Date</th><th>Type</th><th>Référence</th><th>Objet</th><th>Expéditeur</th><th>Destinataire</th><th>Statut</th></tr>${(DB.secretariatCourriers||[]).map(c=>`<tr><td>${c.date}</td><td>${c.type}</td><td>${c.reference}</td><td>${c.objet}</td><td>${c.expediteur}</td><td>${c.destinataire}</td><td>${c.statut}</td></tr>`).join('')}</table></div></div>`;
  else if(secretariatTab==='convocations') html+=`<div class="card"><h3>📣 Convocations</h3><label>Objet</label><input id="secConvObj" placeholder="Objet de la convocation"><label>Participants</label><input id="secConvPart" placeholder="Professeurs, personnel..."><label>Date / heure</label><input id="secConvDate" type="datetime-local"><button class="btn" style="margin-top:10px" onclick="genererConvocationSec()">Générer convocation</button></div><div id="secGenerated"></div>`;
  else if(secretariatTab==='pv') html+=`<div class="card"><h3>📝 Procès-verbaux</h3><label>Réunion / séance</label><input id="secPVObj"><label>Compte rendu</label><textarea id="secPVText" rows="9"></textarea><button class="btn" style="margin-top:10px" onclick="genererPVSec()">Générer le PV</button></div><div id="secGenerated"></div>`;
  else if(secretariatTab==='archivage') html+=`<div class="card"><h3>🗂️ Archivage</h3><div class="grid3"><div><label>Mot-clé</label><input id="secArchQ" oninput="filtrerArchives()" placeholder="mot-clé"></div><div><label>Date</label><input id="secArchDate" type="date" oninput="filtrerArchives()"></div><div><label>Type</label><input id="secArchType" oninput="filtrerArchives()" placeholder="ex. certificat"></div></div><div class="tablewrap"><table id="secArchTable"><tr><th>Date</th><th>Type</th><th>Référence</th><th>Personne</th><th>Mots-clés</th><th>Statut</th></tr>${(DB.secretariatDocuments||[]).map(d=>`<tr><td>${d.date}</td><td>${d.type}</td><td>${d.reference}</td><td>${d.personne}</td><td>${d.motCle}</td><td>${d.statut}</td></tr>`).join('')}</table></div></div>`;
  else if(secretariatTab==='agenda') html+=`<div class="card"><h3>📅 Agenda & réunions</h3><div class="toolbar"><button class="btn" onclick="ajouterReunionSec()">+ Ajouter une réunion</button></div><div class="tablewrap"><table><tr><th>Date</th><th>Heure</th><th>Objet</th><th>Lieu</th><th>Statut</th></tr>${(DB.secretariatReunions||[]).map(r=>`<tr><td>${r.date}</td><td>${r.heure}</td><td>${r.objet}</td><td>${r.lieu}</td><td>${r.statut}</td></tr>`).join('')}</table></div></div>`;
  else if(secretariatTab==='taches') html+=`<div class="card"><h3>✅ Suivi des tâches</h3><div class="toolbar"><button class="btn" onclick="ajouterTacheSec()">+ Nouvelle tâche</button></div><div class="tablewrap"><table><tr><th>Tâche</th><th>Responsable</th><th>Échéance</th><th>Statut</th><th>Rappel</th></tr>${(DB.secretariatTaches||[]).map(t=>`<tr><td>${t.tache}</td><td>${t.responsable}</td><td>${t.echeance}</td><td>${t.statut}</td><td>${new Date(t.echeance+'T00:00:00')<new Date()?'<span class="tag no">En retard</span>':'<span class="tag ok">À suivre</span>'}</td></tr>`).join('')}</table></div></div>`;
  else if(secretariatTab==='personnel') html+=`<div class="card"><h3>👥 Gestion du personnel</h3><p class="note">Dossiers, congés et présences.</p><div class="tablewrap"><table><tr><th>Nom</th><th>Fonction</th><th>Statut</th><th>Congés</th><th>Présence</th></tr>${(DB.secretariatPersonnel||[]).map(p=>`<tr><td>${p.nom}</td><td>${p.fonction}</td><td>${p.statut}</td><td>${p.conges}</td><td>${p.presence}</td></tr>`).join('')}</table></div></div>`;
  else if(secretariatTab==='rapports') { const c=(DB.secretariatCourriers||[]).length, docs=(DB.secretariatDocuments||[]).length, tasks=(DB.secretariatTaches||[]).length; html+=`<div class="grid3"><div class="card"><h3>📬 Courriers traités</h3><p class="bigStat">${(DB.secretariatCourriers||[]).filter(x=>x.statut==='Traité'||x.statut==='Expédié').length}</p></div><div class="card"><h3>🗂️ Documents archivés</h3><p class="bigStat">${docs}</p></div><div class="card"><h3>✅ Tâches suivies</h3><p class="bigStat">${tasks}</p></div></div><div class="card"><h3>📊 Tableau de bord du secrétariat</h3><p>Suivi des volumes de courriers, documents archivés, tâches et réunions.</p><button class="btn" onclick="openPrintPreview('secretariatZone')">Aperçu / Export PDF</button></div><div id="secretariatZone" style="display:none"><div class="card"><h2>${etab()} — Rapport du secrétariat</h2><p>Courriers : ${c} — Documents archivés : ${docs} — Tâches : ${tasks} — Réunions : ${(DB.secretariatReunions||[]).length}</p>${printFooter()}</div></div>`; }
  html+=`</div></div>`; return html;
}
function genererCarteDemo(){const s=DB.students.find(x=>x.id===document.getElementById('secStudent')?.value);if(!s)return;const z=document.getElementById('secGenerated');z.innerHTML=`<div class="secret-id-card" id="secCardDoc"><div><b>${etab()}</b><h3>CARTE D'IDENTITÉ SCOLAIRE</h3><p><b>${s.nom} ${s.prenoms}</b><br>Filière : ${s.filiere} — Classe : ${s.annee}<br>NPI : ${s.npi||'—'}</p></div><div id="secCardQR" class="qr"></div></div><div class="toolbar no-print"><button class="btn" onclick="openPrintPreview('secCardDoc')">Imprimer la carte</button></div>`;makeQR('secCardQR',JSON.stringify({app:'GZ COMPTA',type:'carte scolaire',npi:s.npi,nom:s.nom,prenoms:s.prenoms,classe:s.annee,filiere:s.filiere}));}
function genererLettreSec(){const d=document.getElementById('secDest')?.value||'—',o=document.getElementById('secObjet')?.value||'—',c=document.getElementById('secContenu')?.value||'';document.getElementById('secGenerated').innerHTML=secretariatDoc('lettre','LETTRE ADMINISTRATIVE',d)+`<div class="note">Objet : ${o}<br>${c.replace(/\n/g,'<br>')}</div>`;}
function genererConvocationSec(){const o=document.getElementById('secConvObj')?.value||'Réunion',p=document.getElementById('secConvPart')?.value||'Participants',d=document.getElementById('secConvDate')?.value||todayISO();document.getElementById('secGenerated').innerHTML=secretariatDoc('convocation','CONVOCATION',p)+`<p><b>Objet :</b> ${o}<br><b>Date / heure :</b> ${d}</p>`;}
function genererPVSec(){const o=document.getElementById('secPVObj')?.value||'Réunion',t=document.getElementById('secPVText')?.value||'';document.getElementById('secGenerated').innerHTML=secretariatDoc('pv','PROCÈS-VERBAL',o)+`<div class="note">${t.replace(/\n/g,'<br>')}</div>`;}
function ajouterCourrierSec(){const objet=prompt('Objet du courrier :','');if(objet===null)return;DB.secretariatCourriers.unshift({id:uid(),date:todayISO(),type:'Courrier arrivé',reference:'ARR-'+Date.now().toString().slice(-6),objet,expediteur:'À renseigner',destinataire:'Direction',statut:'À traiter'});saveDB();render();}
function ajouterReunionSec(){const objet=prompt('Objet de la réunion :','');if(objet===null)return;DB.secretariatReunions.push({id:uid(),date:todayISO(),heure:'09:00',objet,lieu:'À préciser',statut:'Planifiée'});saveDB();render();}
function ajouterTacheSec(){const t=prompt('Tâche à suivre :','');if(t===null)return;DB.secretariatTaches.push({id:uid(),tache:t,responsable:'À attribuer',echeance:todayISO(),statut:'À faire'});saveDB();render();}
function filtrerTableSec(inputId,tableId){const q=(document.getElementById(inputId)?.value||'').toLowerCase();document.querySelectorAll('#'+tableId+' tr').forEach((r,i)=>{if(i===0)return;r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';});}
function filtrerArchives(){const q=(document.getElementById('secArchQ')?.value||'').toLowerCase(),d=document.getElementById('secArchDate')?.value||'',t=(document.getElementById('secArchType')?.value||'').toLowerCase();document.querySelectorAll('#secArchTable tr').forEach((r,i)=>{if(i===0)return;const x=r.textContent.toLowerCase();r.style.display=(!q||x.includes(q))&&(!d||r.cells[0]?.textContent===d)&&(!t||x.includes(t))?'':'none';});}

function render(){
  normalizeUserSite();
  if(!canView(currentView)){ currentView = userRole()==='censeur' ? 'inscription' : 'dashboard'; }
  renderNav();
  const map={
    dashboard:viewDashboard, consolidation:viewConsolidation,
    inscription:viewInscription, paiements:viewPaiements, salaires:viewSalaires, relances:viewRelances,
    abandons:viewAbandons, depots:viewDepots, bilan:viewBilan, charges:viewCharges,
    vacations:viewVacations, etatsfinanciers:viewEtatsFinanciers,
    pedagogie:viewPedagogie, cantine:viewCantine, liaison:viewLiaison,
    parametres:viewParametres, secretariat:viewSecretariat
  };
  document.getElementById('main').innerHTML = (map[currentView]||viewDashboard)();
}
function daysSince(dateStr){ return Math.floor((new Date(todayISO()) - new Date(dateStr))/86400000); }
/* ================= VUE : TABLEAU DE BORD ================= */
function viewDashboard(){
  let html = head("Tableau de bord", "var(--mod-param)");
  const pays = DB.payments.filter(p=>matchScope(p)&&!p.annule);
  const today = todayISO();
  const thisMonth = today.slice(0,7);
  const recettesJour = pays.filter(p=>p.date===today).reduce((s,p)=>s+p.montantPaye,0);
  const recettesMois = pays.filter(p=>p.date&&p.date.slice(0,7)===thisMonth).reduce((s,p)=>s+p.montantPaye,0);
  const d=new Date(today+'T00:00:00'); const day=d.getDay()||7; const monday=new Date(d); monday.setDate(d.getDate()-day+1); const mondayISO=monday.toISOString().slice(0,10);
  const recettesSemaine=pays.filter(p=>p.date&&p.date>=mondayISO&&p.date<=today).reduce((s,p)=>s+p.montantPaye,0);

  const students = DB.students.filter(s=>matchScope(s) && s.statut!=='Abandon');
  const lastPayByStudent={};
  pays.forEach(p=>{ lastPayByStudent[p.studentId]=p; });
  const impayes = students.filter(s=>{ const lp=lastPayByStudent[s.id]; return !lp || lp.resteAPayer>0; }).length;

  const montantAttendu = students.reduce((s,st)=>s+totalDu(st),0);
  const reductionAccordee = pays.reduce((s,p)=>s+(Number(p.reduction)||0),0);
  const montantDuNet = Math.max(montantAttendu - reductionAccordee, 0);
  const encaisseScoInsc = pays.reduce((s,p)=>s+(Number(p.insc)||0)+(Number(p.sco)||0),0);
  const montantImpayes = Math.max(montantDuNet - encaisseScoInsc, 0);
  const tauxRecouvrement = montantDuNet>0 ? Math.round((encaisseScoInsc/montantDuNet)*1000)/10 : 0;
  const nombreProfesseurs = DB.teachers.length;
  const nombreFilieres = (DB.filieres[etab()]||[]).length;
  const sc = soldeCaisseActuel();

  if(!DB.lastBackupDate || daysSince(DB.lastBackupDate)>=7){
    html += `<div class="card" style="border-color:var(--danger)">
      <h3 style="margin-top:0">⚠️ Sauvegarde recommandée</h3>
      <p>${DB.lastBackupDate ? `Dernière sauvegarde il y a ${daysSince(DB.lastBackupDate)} jour(s).` : "Aucune sauvegarde n'a encore été faite."} Pensez à exporter une sauvegarde régulièrement pour éviter toute perte de données (panne, vol, réinstallation...).</p>
      <button class="btn small" onclick="exportBackup()">Sauvegarder maintenant</button>
    </div>`;
  }

  const logo=(DB.etabInfo[etab()]&&DB.etabInfo[etab()].logo)?`<img class="logo" src="${DB.etabInfo[etab()].logo}">`:'';
  html += `<div class="card toolbar"><div style="align-self:flex-end"><button class="btn small outline" onclick="openPrintPreview('dashboardZone')">Aperçu avant impression</button></div></div>`;

  html += `<div id="dashboardZone">
  <div class="card" style="border:none;box-shadow:none;padding-bottom:0">
    <div style="overflow:auto">${logo}<h3 style="margin:0">${etab()}</h3>${coordEtab(etab())}<div>Tableau de bord — Exercice ${exercice()} — ${todayISO()}</div></div>
    <div style="clear:both"></div>
  </div>
  <div class="grid3">
    <div class="card"><h3 style="margin-top:0">💵 Encaissement du jour</h3><p style="font-size:22px;font-weight:700;margin:0">${fmt(recettesJour)} FCFA</p></div>
    <div class="card"><h3 style="margin-top:0">📈 Encaissement du mois</h3><p style="font-size:22px;font-weight:700;margin:0">${fmt(recettesMois)} FCFA</p></div>
    <div class="card"><h3 style="margin-top:0">📅 Encaissement de la semaine</h3><p style="font-size:22px;font-weight:700;margin:0">${fmt(recettesSemaine)} FCFA</p></div>
  </div>
  <div class="grid3">
    <div class="card"><h3 style="margin-top:0">🎓 Apprenants actifs</h3><p style="font-size:22px;font-weight:700;margin:0">${students.length}</p></div>
  </div>
  <div class="grid3">
    <div class="card"><h3 style="margin-top:0">⚠️ Comptes apprenants non soldés</h3><p style="font-size:22px;font-weight:700;margin:0;color:${impayes>0?'var(--danger)':'inherit'}">${impayes}</p></div>
    <div class="card"><h3 style="margin-top:0">🏫 Établissement actif</h3><p style="font-size:16px;font-weight:600;margin:0">${etab()}</p></div>
    <div class="card"><h3 style="margin-top:0">📅 Exercice actif</h3><p style="font-size:16px;font-weight:600;margin:0">${exercice()}</p></div>
  </div>
  <div class="grid3">
    <div class="card"><h3 style="margin-top:0">🎯 Montant attendu</h3><p style="font-size:20px;font-weight:700;margin:0">${fmt(montantAttendu)} FCFA</p><p class="note" style="margin:4px 0 0">Scolarité + inscription, avant réduction</p></div>
    <div class="card"><h3 style="margin-top:0">✅ Taux de recouvrement</h3><p style="font-size:22px;font-weight:700;margin:0">${tauxRecouvrement}%</p></div>
    <div class="card"><h3 style="margin-top:0">🔴 Montant des impayés</h3><p style="font-size:20px;font-weight:700;margin:0;color:${montantImpayes>0?'var(--danger)':'inherit'}">${fmt(montantImpayes)} FCFA</p></div>
  </div>
  <div class="grid3">
    <div class="card"><h3 style="margin-top:0">🏷️ Réduction accordée</h3><p style="font-size:20px;font-weight:700;margin:0">${fmt(reductionAccordee)} FCFA</p></div>
    <div class="card"><h3 style="margin-top:0">👩‍🏫 Nombre de professeurs</h3><p style="font-size:22px;font-weight:700;margin:0">${nombreProfesseurs}</p></div>
    <div class="card"><h3 style="margin-top:0">📂 Nombre de filières</h3><p style="font-size:22px;font-weight:700;margin:0">${nombreFilieres}</p></div>
  </div>
  <div class="grid3">
    <div class="card"><h3 style="margin-top:0">🏛️ Solde de caisse</h3><p style="font-size:22px;font-weight:700;margin:0;color:${sc.solde>=0?'var(--ok)':'var(--danger)'}">${fmt(sc.solde)} FCFA</p></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">📊 Attendu, encaissé et impayés (scolarité + inscription)</h3>
    ${svgBarChart([
      {label:'Attendu', value:montantDuNet, color:'#b8912f'},
      {label:'Encaissé', value:encaisseScoInsc, color:'#2d6a4f'},
      {label:'Impayés', value:montantImpayes, color:'#a3312c'}
    ])}
  </div>
  <div class="card">
    <h3 style="margin-top:0">🥧 Répartition des apprenants par filière</h3>
    ${cssDonut(filieresOf().map(f=>({label:f, value:students.filter(s=>s.filiere===f).length})))}
  </div>
  ${printFooter()}
  </div>`;
  return html;
}

(async function init(){
  await loadDB();
  DB.personnelAdministratif=DB.personnelAdministratif||[]; DB.salaires=DB.salaires||[]; DB.paymentCancellations=DB.paymentCancellations||[];
  lanCfg();
  if(window.electronAPI&&window.electronAPI.lan){
    if(DB.lan.mode==='serveur') await window.electronAPI.lan.startServer({port:47821,key:DB.lan.key});
    if(DB.lan.mode==='client') setTimeout(()=>syncFromCensorat(),1500);
  }
  await checkLicenseAndRender();
})();

setTimeout(()=>{
  document.getElementById('mobileMenuBtn')?.addEventListener('click',openMobileMenu);
  document.getElementById('mobileMenuBackdrop')?.addEventListener('click',closeMobileMenu);
},0);
</script>
