<style>
:root{
  --ink:#1c2b23;
  --cream:#eef3f9;
  --deep:#071b36;      /* bleu nuit dominant */
  --gold:#d5aa45;       /* accent or */
  --paper:#ffffff;
  --line:#dcd3bd;
  --pureblue:#0039c6;   /* bleu pur — options & tableaux */
  --purewhite:#ffffff;  /* blanc pur — options & tableaux */
  --mod-inscription:#2c6e91;
  --mod-paiement:#2d6a4f;
  --mod-compta:#a3701b;
  --mod-vacation:#6b4e71;
  --mod-tresorerie:#1f6f78;
  --mod-bilan:#8a3b3b;
  --mod-param:#4a4a4a;
  --mod-peda:#1e5c8a;
  --mod-cantine:#b0651f;
  --danger:#a3312c;
  --ok:#2d6a4f;
}
*{box-sizing:border-box;}
html{height:100%;}
body{margin:0;height:100%;overflow:hidden;font-family:'Source Sans Pro',Arial,sans-serif;background:var(--cream);color:var(--ink);}
h1,h2,h3,.brand{font-family:Georgia,'Times New Roman',serif;}
/* #app est figé à la hauteur de l'écran : la bande de menus (nav) et la
   page de contenu (#main) défilent CHACUNE dans leur propre zone, l'une
   n'entraîne jamais l'autre. */
#app{display:flex;flex-direction:row;height:100vh;width:100%;overflow:hidden;}
#sidebar{width:285px;min-width:285px;height:100%;background:linear-gradient(180deg,#06172e 0%,#0a2547 100%);color:#f5f8fc;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:4px 0 18px rgba(0,0,0,.18);z-index:20;}
#sidebar .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px;min-height:66px;}
#sidebar .brand img{height:38px;width:38px;object-fit:contain;border-radius:8px;background:#fff;}
#sidebar .brand small{display:block;font-family:Arial,sans-serif;font-size:10px;opacity:.68;letter-spacing:.06em;margin-top:3px;}
#etabSwitch{padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.12);flex-shrink:0;background:rgba(255,255,255,.025);}
#etabSwitch label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#b8c8dc!important;margin:0 0 5px;}
#etabSwitch select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid rgba(116,169,224,.35);font-size:13px;margin-bottom:10px;background:#12365f;color:#fff;}
#etabSwitch select:last-child{margin-bottom:0;}
nav{flex:1;padding:10px 9px 14px;overflow-y:auto;overflow-x:hidden;min-height:0;}
.navGroup{margin:0 0 9px;}
.navGroupTitle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px 6px;color:#8fa9c5;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;background:transparent;border:0;cursor:pointer;}
.navGroupTitle .chev{transition:transform .18s ease;display:inline-block;}
.navGroupTitle.collapsed .chev{transform:rotate(-90deg);}
.navGroupItems{overflow:hidden;max-height:900px;transition:max-height .2s ease;}
.navGroupItems.collapsed{max-height:0;}
nav button.navItem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;color:#eaf1f8;padding:10px 11px;margin:2px 0;font-size:13px;cursor:pointer;opacity:.92;transition:background .16s,transform .16s,border-color .16s,box-shadow .16s;position:relative;touch-action:manipulation;}
nav button.navItem:hover{background:rgba(255,255,255,.09);border-color:rgba(116,169,224,.24);opacity:1;transform:translateX(3px);}
nav button.navItem.active{background:linear-gradient(90deg,#164d83,#10375f);border-color:rgba(116,169,224,.45);box-shadow:inset 3px 0 0 var(--gold),0 3px 10px rgba(0,0,0,.15);opacity:1;font-weight:700;}
nav button.navItem .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.06);}
.navIcon{width:23px;text-align:center;font-size:16px;flex-shrink:0;}
.navLabel{white-space:normal;line-height:1.25;}
#main{flex:1;min-width:0;width:calc(100% - 285px);padding:28px 34px;overflow-y:auto;overflow-x:auto;min-height:0;background:linear-gradient(180deg,#f5f8fc 0%,#eaf0f7 100%);} 
#userInfo{background:rgba(0,0,0,.12);}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.pagehead .bar{width:6px;height:26px;border-radius:3px;}
.pagehead h2{margin:0;font-size:22px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:18px;}
label{display:block;font-size:12.5px;font-weight:600;color:#555;margin:8px 0 3px;}
input,select,textarea{width:100%;padding:7px 9px;border:1.5px solid var(--pureblue);border-radius:5px;font-size:14px;background:var(--purewhite);color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pureblue);outline-offset:1px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px;}
button.btn{cursor:pointer;border:none;padding:9px 16px;border-radius:6px;font-size:13.5px;font-weight:600;color:#fff;background:var(--deep);}
button.btn.outline{background:var(--purewhite);border:1.5px solid var(--pureblue);color:var(--pureblue);}
button.btn.danger{background:var(--danger);}
button.btn.small{padding:5px 10px;font-size:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;background:var(--purewhite);}
th,td{border:1px solid var(--pureblue);padding:6px 8px;text-align:left;}
th{background:var(--pureblue);color:var(--purewhite);}
tr:nth-child(even) td{background:#eef2ff;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;color:#fff;}
.tag.ok{background:var(--ok);} .tag.no{background:var(--danger);} .tag.warn{background:#b8912f;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
.receipt{width:210mm;background:#fff;border:2px solid var(--deep);padding:18px 24px;margin:0 auto 20px;font-size:13px;}
.receipt h3{margin:0 0 2px;color:var(--deep);}
.receipt .num{float:right;font-weight:bold;}
.receipt table{margin-top:10px;}
.receipt .qr{float:right;margin-left:12px;}
.receipt .logo{float:left;margin-right:12px;height:60px;object-fit:contain;}
.receipt .photo{float:right;margin-left:12px;height:80px;width:64px;object-fit:cover;border:1px solid var(--pureblue);}
.receipt .cut{border-top:2px dashed #999;margin:18px 0;text-align:center;font-size:11px;color:#888;}
.receipt table.vform{width:100%;border-collapse:collapse;}
.receipt table.vform td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
.receipt table.vform td:first-child{width:220px;color:var(--deep);}
.navTip{display:none;position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);width:235px;background:#071b36;color:#fff;font-size:12px;line-height:1.45;padding:10px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.32);z-index:9999;text-align:left;font-weight:400;border:1px solid rgba(116,169,224,.35);pointer-events:none;}
#navList button.navItem:hover .navTip{display:block;}
#navList{position:relative;}
@media (max-width:900px){.navTip{display:none!important;}.navItem:hover{transform:none!important;}}
@media print{ #sidebar,.no-print{display:none!important;} #main{padding:0;} body{background:#fff;} }
.note{font-size:12px;color:#777;margin-top:6px;}
.pill{font-size:11px;padding:1px 7px;border-radius:8px;background:#eee;color:#555;margin-left:6px;}
.thumb{height:34px;width:28px;object-fit:cover;border:1px solid var(--pureblue);border-radius:3px;vertical-align:middle;}
/* ===== Aperçu avant impression ===== */
#printPreviewOverlay{display:none;position:fixed;inset:0;background:rgba(10,20,15,.78);z-index:9999;overflow-y:auto;padding:26px 0 60px;}
#printPreviewOverlay.show{display:block;}
.print-preview-toolbar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;align-items:center;padding:12px;background:var(--deep);margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.print-preview-toolbar span{color:#f2ead9;font-size:13px;margin-right:8px;}
.print-preview-paper{background:#fff;max-width:230mm;margin:0 auto;padding:14mm 10mm;box-shadow:0 8px 30px rgba(0,0,0,.45);border-radius:3px;}
@media print{
  body.previewing #app{display:none!important;}
  .print-preview-toolbar{display:none!important;}
  #printPreviewOverlay{position:static!important;background:none!important;padding:0!important;overflow:visible!important;}
  .print-preview-paper{box-shadow:none!important;margin:0!important;max-width:none!important;padding:0!important;}
  body:not(.previewing) #printPreviewOverlay{display:none!important;}
}
/* ===== RESPONSIVE PROFESSIONNEL ===== */
#mobileMenuBtn{display:none;position:fixed;left:12px;top:12px;z-index:10001;border:0;border-radius:10px;background:#08213f;color:#fff;padding:10px 13px;font-size:18px;box-shadow:0 5px 18px rgba(0,0,0,.25);cursor:pointer;}
#mobileMenuBackdrop{display:none;position:fixed;inset:0;background:rgba(3,15,30,.48);z-index:9998;}
@media (max-width:900px){
  #mobileMenuBtn{display:block;}
  #app{display:block;width:100%;height:100vh;overflow:hidden;}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:300px;min-width:300px;height:100vh;transform:translateX(-105%);transition:transform .22s ease;z-index:10000;box-shadow:8px 0 28px rgba(0,0,0,.30);}
  #sidebar.mobile-open{transform:translateX(0);}
  #mobileMenuBackdrop.show{display:block;}
  #main{width:100%;height:100vh;padding:54px 18px 20px;overflow:auto;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .pagehead h2{font-size:19px;}
  .navTip{display:none!important;}
  nav button.navItem:hover{transform:none!important;}
}
@media (max-width:430px){
  #sidebar{width:286px;min-width:286px;}
  #main{padding:54px 12px 16px;}
  #sidebar .brand{padding:14px 12px;}
  #sidebar .brand small{font-size:9px;}
  #etabSwitch{padding:10px;}
  nav{padding:8px 7px 12px;}
  nav button.navItem{font-size:12px;padding:9px 8px;}
  .navGroupTitle{font-size:9px;padding-left:7px;}
}


.school-bulletin{width:210mm;min-height:297mm;background:#fff;color:#222;margin:0 auto 20px;padding:10mm 9mm;border:1px solid #555;font-family:Arial,Helvetica,sans-serif;font-size:10px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.bulletin-header{text-align:center;border-bottom:3px solid #222;padding-bottom:5px}.bulletin-brand{display:flex;justify-content:center;align-items:center;gap:12px;text-align:left}.bulletin-logo{width:52px;height:52px;object-fit:contain}.bulletin-country{font-weight:800;font-size:11px}.bulletin-min{font-size:7px;max-width:520px}.bulletin-school{font-weight:800;font-size:16px;margin-top:3px}.bulletin-header .note{font-size:7px;margin:2px 0}.bulletin-title{text-align:center;font-weight:900;font-size:14px;padding:7px;background:#ececec;border-bottom:1px solid #333}.bulletin-info{display:grid;grid-template-columns:1.2fr 1.25fr .45fr;border:1px solid #333}.bulletin-info>div{padding:6px;border-right:1px solid #333;line-height:1.65}.bulletin-info>div:last-child{border-right:0}.bulletin-photo-box{display:flex;align-items:center;justify-content:center}.bulletin-photo{width:68px;height:82px;object-fit:cover;border:1px solid #333}.placeholder-photo{display:flex;align-items:center;justify-content:center;font-size:28px;background:#f4f4f4}.bulletin-marks{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:7px;font-size:8.5px}.bulletin-marks th,.bulletin-marks td{border:1px solid #444;padding:4px 3px;text-align:center;overflow-wrap:anywhere;word-break:normal}.bulletin-marks th:nth-child(1),.bulletin-marks td:nth-child(1){width:18%}.bulletin-marks th:nth-child(n+2),.bulletin-marks td:nth-child(n+2){width:11.714%}.bulletin-marks th:first-child,.bulletin-marks td:first-child{text-align:left}.bulletin-marks th{background:#444;color:#fff}.bulletin-total td{background:#eee}.bulletin-summary{display:grid;grid-template-columns:1fr 1fr;border:1px solid #444;margin-top:8px}.bulletin-summary>div{padding:7px;line-height:1.65;border-right:1px solid #444}.bulletin-summary>div:last-child{border-right:0}.bulletin-appreciation{display:grid;grid-template-columns:1fr 1fr;min-height:90px;border:1px solid #444;margin-top:8px}.bulletin-appreciation>div{padding:8px}.bulletin-signature{text-align:right;padding-top:45px!important}.bulletin-appreciation+.print-footer{margin-top:10px}
@media print{.school-bulletin{box-shadow:none;border:0;margin:0;width:210mm;min-height:297mm}.bulletin-marks{font-size:8px}}

.etatTabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Sous-navigation pédagogique : même logique que les États financiers, mais verticale et séparée */

.pedaSubnav{background:#071b36;border:1px solid #173e69;border-radius:10px;padding:8px;position:sticky;top:8px;}
.pedaSubnav .subTitle{color:#9eb5cf;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;padding:9px 10px 7px;}
.pedaSubnav button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:transparent;color:#eaf1f8;border-radius:7px;padding:9px 10px;margin:2px 0;cursor:pointer;font-size:12.5px;transition:.16s;}
.pedaSubnav button:hover{background:rgba(255,255,255,.09);border-color:rgba(116,169,224,.25);transform:translateX(2px);}
.pedaSubnav button.active{background:linear-gradient(90deg,#164d83,#10375f);border-color:rgba(116,169,224,.45);box-shadow:inset 3px 0 0 var(--gold);font-weight:700;}
.pedaContent{min-width:0;}
.bulletin-qr-box{display:flex;align-items:center;gap:10px;border-top:1px solid #444;margin-top:10px;padding-top:8px}.universal-print-qr{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;padding-top:8px;border-top:1px dashed #777;font-size:7px;color:#555;max-width:100%}.universal-print-qr .print-qr-caption{max-width:180px;line-height:1.35}
.bulletin-qr-box small{font-size:7px;line-height:1.35;color:#555;max-width:180px;}
@media(max-width:900px){.pedaLayout{grid-template-columns:1fr;}.pedaSubnav{position:static;display:flex;flex-direction:column;gap:2px;}.pedaSubnav .subTitle{width:100%;}.pedaSubnav button{margin:0;width:100%;}.bulletin-qr-box{justify-content:flex-start;}.grid4{grid-template-columns:repeat(2,minmax(0,1fr));}}

.etatTabs .btn{min-width:150px}
.etatTabs .btn.active{box-shadow:0 4px 12px rgba(0,0,0,.15);transform:translateY(-1px)}
@media(max-width:700px){.etatTabs{display:grid;grid-template-columns:1fr;}.etatTabs .btn{width:100%;min-width:0}}

.secretLayout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}.secretSubnav{background:#071b36;border:1px solid #173e69;border-radius:10px;padding:8px;position:sticky;top:8px}.secretSubnav .subTitle{color:#9eb5cf;font-size:10px;font-weight:800;letter-spacing:.13em;padding:9px 10px 7px}.secretSubnav button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:transparent;color:#eaf1f8;border-radius:7px;padding:9px 10px;margin:2px 0;cursor:pointer;font-size:12px}.secretSubnav button:hover,.secretSubnav button.active{background:linear-gradient(90deg,#164d83,#10375f);border-color:rgba(116,169,224,.35)}.secretSubnav button.active{box-shadow:inset 3px 0 0 var(--gold);font-weight:700}.secretContent{min-width:0}.payment-filter-box{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:8px;align-items:end;margin-bottom:10px}.secret-id-card{width:86mm;min-height:54mm;border:2px solid var(--deep);border-radius:10px;padding:12px;background:#fff;display:flex;justify-content:space-between;gap:10px}.bigStat{font-size:28px;font-weight:800;margin:0;color:var(--deep)}
@media(max-width:900px){.secretLayout{grid-template-columns:1fr}.secretSubnav{position:static}.payment-filter-box{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.payment-filter-box{grid-template-columns:1fr}.secret-id-card{width:100%}}

  body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}

<body>
<button id="mobileMenuBtn" type="button" aria-label="Ouvrir le menu">☰</button>

<div id="app">
  <div id="sidebar">
    <div class="brand" id="brandZone">GZ COMPTA<small>GESTION INTÉGRÉE · GZ IMMO BENIN</small></div>
    <div id="etabSwitch">
      <label style="color:#f2ead9;">Établissement actif</label>

  directeurNom: "", // nom du/de la directeur(rice) — signature sur états de vacation

  users: [{"id": "demo-admin", "nom": "Administrateur Démo", "login": "demo", "salt": "gz-demo-2026", "hash": "d3fbcc4541a78777450480501d680415db0d204b711bd5f7fbdece863744ecff", "role": "admin"}], // compte DEMO : demo / demo1234

/* Stockage 100% local au PC (localStorage du navigateur) — aucune connexion
   internet requise, les données restent sur cette machine/ce profil navigateur. */
const STORAGE_KEY = 'gestion_cpet_cpfpa_db';
async function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    DB = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_DB));
  }catch(e){ DB = JSON.parse(JSON.stringify(DEFAULT_DB)); }
  // fusion des clés manquantes (mises à jour futures)
  for(const k in DEFAULT_DB){ if(!(k in DB)) DB[k]=DEFAULT_DB[k]; }
  if(!Array.isArray(DB.evaluations)) DB.evaluations=[];
  migrateLegacyNotes();
  seedDemoPedagogy();
  if(Array.isArray(DB.users)) DB.users.forEach(u=>{ if(u.role!=='admin' && !u.site) u.site=(DB.etablissements||[])[0]||''; });
}
async function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ console.error('Erreur sauvegarde', e); alert("Erreur d'enregistrement (mémoire du navigateur pleine ?) — pensez à faire une Sauvegarde depuis Paramètres."); }
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sauvegarde-gz-compta-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  DB.lastBackupDate = todayISO();
  saveDB();
  if(currentView==='dashboard') render();
}
function importBackup(){
  const inp = document.getElementById('restoreInput');
  if(!inp.files || !inp.files[0]) return alert("Choisissez d'abord un fichier de sauvegarde (.json).");
  if(!confirm("Cette opération va REMPLACER toutes les données actuelles par celles du fichier importé. Continuer ?")) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      DB = data;
      for(const k in DEFAULT_DB){ if(!(k in DB)) DB[k]=DEFAULT_DB[k]; }
      currentEtab=0; currentExercice=0;
      saveDB(); render();
      alert("Sauvegarde restaurée avec succès.");
    }catch(e){ alert("Fichier invalide — impossible de restaurer cette sauvegarde."); }
  };
  reader.readAsText(inp.files[0]);
}

/* Petits graphiques inline (SVG / CSS conic-gradient), sans aucune
   dépendance externe — fonctionnent hors-ligne. */
const CHART_PALETTE=['#1e5c8a','#b0651f','#2d6a4f','#8a3b3b','#4a4a4a','#b8912f','#123328'];
function svgBarChart(data, opts){
  opts = opts||{};
  const w = opts.width||480, h = opts.height||220;
  const padL=44, padB=46, padT=20, padR=16;
  const max = Math.max(1, ...data.map(d=>d.value));
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const gap = chartW/data.length;
  const bw = Math.min(64, gap*0.55);
  let bars='', labels='';
  data.forEach((d,i)=>{
    const bh = max>0 ? (d.value/max)*chartH : 0;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + (chartH-bh);
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,1)}" fill="${d.color||CHART_PALETTE[i%CHART_PALETTE.length]}" rx="3"></rect>`;
    bars += `<text x="${x+bw/2}" y="${y-6}" font-size="11" text-anchor="middle" fill="#333">${fmt(d.value)}</text>`;
    const lbl = d.label.length>12 ? d.label.slice(0,11)+'…' : d.label;
    labels += `<text x="${x+bw/2}" y="${h-padB+18}" font-size="10.5" text-anchor="middle" fill="#555">${lbl}</text>`;
  });
  const axis = `<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="#ccc" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;display:block;margin:6px auto">${axis}${bars}${labels}</svg>`;
}
function cssDonut(data, size){
  size=size||150;
  const total = data.reduce((s,d)=>s+d.value,0)||1;
  let acc=0; const stops=[];
  data.forEach((d,i)=>{
    const start=acc/total*360; acc+=d.value; const end=acc/total*360;
    stops.push(`${d.color||CHART_PALETTE[i%CHART_PALETTE.length]} ${start}deg ${end}deg`);
  });
  const legend = data.map((d,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0"><span style="width:10px;height:10px;border-radius:2px;background:${d.color||CHART_PALETTE[i%CHART_PALETTE.length]};display:inline-block;flex-shrink:0"></span>${d.label} (${d.value})</div>`).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${stops.join(', ')});flex-shrink:0"></div>
    <div>${legend||'<span class="note">Aucune donnée.</span>'}</div>
  </div>`;
}

/* ================= LICENCE (hors-ligne) =================
   Un code de licence contient une date d'expiration signée avec une clé
   secrète partagée UNIQUEMENT entre ce logiciel et l'outil séparé
   "generateur-licence.html" (jamais installé chez le client). Vérification
   100% locale, aucune connexion internet requise. */
const LICENSE_SECRET = "NDL-DZ-2026-K9rT3mQ7pL2vX8sW4aF6hJ1nB5yE0uR";
function b64urlEncode(str){
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4) str+='=';
  return decodeURIComponent(escape(atob(str)));
}
async function hmacHex(message, secret){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const sigBuf = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return Array.from(new Uint8Array(sigBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function verifyLicenseCode(code){
  code = (code||'').trim().replace(/\s+/g,'');
  const parts = code.split('.');
  if(parts.length!==2) return {ok:false};
  const [payloadB64, sig] = parts;
  const expectedSig = await hmacHex(payloadB64, LICENSE_SECRET);
  if(expectedSig.slice(0,16) !== sig.toLowerCase()) return {ok:false};
  let payload;
  try{ payload = JSON.parse(b64urlDecode(payloadB64)); }catch(e){ return {ok:false}; }
  if(!payload || !payload.e) return {ok:false};
  return {ok:true, client:payload.c||'', exp:payload.e};
}
function daysLeftOf(exp){ return Math.ceil((new Date(exp) - new Date(todayISO()))/86400000); }
function showLicenseGate(lic){
  document.getElementById('app').style.display='none';
  const gate=document.getElementById('licenseGate');
  gate.style.display='flex';
  const msg=document.getElementById('licenseGateMsg');
  if(lic && lic.exp){
    msg.innerHTML = `Licence expirée le <b>${lic.exp}</b>${lic.client?(' — '+lic.client):''}.<br>Merci de saisir un nouveau code de licence pour continuer à utiliser le logiciel.`;
  } else {
    msg.innerHTML = `Ce logiciel nécessite une licence.<br>Merci de saisir le code de licence fourni par l'éditeur.`;
  }
  document.getElementById('licenseInput').value='';
  document.getElementById('licenseGateError').textContent='';
}
function hideLicenseGate(){
  document.getElementById('app').style.display='flex';
  document.getElementById('licenseGate').style.display='none';
}
async function activateLicenseCode(){
  const code=document.getElementById('licenseInput').value;
  const errEl=document.getElementById('licenseGateError');
  errEl.textContent='';
  if(!code||!code.trim()){ errEl.textContent="Veuillez saisir un code de licence."; return; }
  const v = await verifyLicenseCode(code);
  if(!v.ok){ errEl.textContent="Code de licence invalide. Vérifiez qu'il a été copié en entier, sans espace ni ligne coupée."; return; }
  if(daysLeftOf(v.exp)<0){ errEl.textContent=`Ce code est expiré depuis le ${v.exp}. Demandez un nouveau code à l'éditeur.`; return; }
  DB.license = {code:code.trim().replace(/\s+/g,''), client:v.client, exp:v.exp};
  saveDB();
  hideLicenseGate();
  checkAuthAndRender();
}
async function checkLicenseAndRender(){
  const lic = DB.license;
  if(lic && lic.code){
    const v = await verifyLicenseCode(lic.code);
    if(v.ok && daysLeftOf(v.exp)>=0){ hideLicenseGate(); checkAuthAndRender(); return; }
  }
  showLicenseGate(lic);
}

/* ================= COMPTES UTILISATEURS (connexion/déconnexion) =================
   Comptes stockés localement (identifiant + mot de passe haché SHA-256 salé).
   Une connexion est requise à chaque démarrage du logiciel. */
let currentUser = null;
function randSalt(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
async function sha256Hex(str){
  const enc=new TextEncoder();
  const buf=await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(pwd, salt){ return sha256Hex(salt+':'+pwd); }
function checkAuthAndRender(){

  if(currentUser){ hideAuthGate(); render(); return; }

async function resetCodeForDate(dateStr){
  return (await hmacHex('RESET-'+dateStr, LICENSE_SECRET)).slice(0,8).toUpperCase();
}

  if(pwd!==pwd2){ err.textContent="Les mots de passe ne correspondent pas."; return; }

  const hash=await hashPassword(pwd, u.salt);
  if(hash!==u.hash){ err.textContent="Identifiant ou mot de passe incorrect."; return; }
  currentUser=u;
  hideAuthGate(); render();
}

const UNITS=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
"onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const TENS=["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
function chunk999(n){
  n=Math.floor(n);
  let s="";
  const c=Math.floor(n/100), r=n%100;
  if(c>0) s+= (c>1?UNITS[c]+" cent":"cent")+((c>1&&r===0)?"s":"")+" ";
  if(r>0){
    if(r<20) s+=UNITS[r];
    else{
      const t=Math.floor(r/10), u=r%10;
      if(t===7||t===9){ s+=TENS[t]+"-"+UNITS[10+u]; }
      else{ s+=TENS[t]+(u>0?("-"+(u===1&&t!==8?"et-un":UNITS[u])):(t===8?"s":"")); }
    }
  }
  return s.trim();
}
function nombreEnLettres(n){
  n=Math.round(Number(n)||0);
  if(n===0) return "zéro franc CFA";
  let parts=[];
  const milliards=Math.floor(n/1e9); n%=1e9;
  const millions=Math.floor(n/1e6); n%=1e6;
  const milliers=Math.floor(n/1e3); n%=1e3;
  if(milliards) parts.push(chunk999(milliards)+(milliards>1?" milliards":" milliard"));
  if(millions) parts.push(chunk999(millions)+(millions>1?" millions":" million"));
  if(milliers) parts.push((milliers===1?"mille":chunk999(milliers)+" mille"));
  if(n) parts.push(chunk999(n));
  return (parts.join(" ").replace(/\s+/g,' ').trim()+" francs CFA");
}

function addUniversalPrintQR(clone, label){
  if(clone.querySelector('.qr, [data-document-qr]')) return;

  const payload=JSON.stringify({application:'GZ-COMPTA',document:label,etablissement:etab(),date:todayISO(),contenu:raw.slice(0,1900)});

  const clone=src.cloneNode(true);
  clone.querySelectorAll('.no-print').forEach(el=>el.remove());
  addUniversalPrintQR(clone,lastPrintLabel);
  const content=document.getElementById('printPreviewContent');

function centralMetrics(et, ex){
  const pays=(DB.payments||[]).filter(p=>p.etab===et && (!p.exercice||p.exercice===ex) && !p.annule);
  const charges=(DB.charges||[]).filter(c=>c.etab===et && (!c.exercice||c.exercice===ex));
  const salaires=(DB.salaires||[]).filter(x=>x.etab===et && (!x.exercice||x.exercice===ex) && (x.statut||'paye')==='paye');
  const students=(DB.students||[]).filter(x=>x.etab===et && (!x.exercice||x.exercice===ex) && x.statut!=='Abandon');
  const recettes=pays.reduce((a,x)=>a+Number(x.montantPaye??x.montant??0),0);
  const depenses=charges.reduce((a,x)=>a+Number(x.montant??0),0);
  const sal=salaires.reduce((a,x)=>a+Number(x.net??x.montant??0),0);
  return {students:students.length,recettes,depenses,salaires:sal,solde:recettes-depenses-sal};
}

  saveDB(); render();
}
function addCompteRecette(){
  const code=document.getElementById('rcCode').value.trim(), lib=document.getElementById('rcLib').value.trim();
  if(!code||!lib) return alert("Code et libellé requis.");
  DB.comptesRecettes.push({code,lib}); saveDB(); render();
}
function delCompteRecette(i){
  if(DB.comptesRecettes[i] && DB.comptesRecettes[i].field) return; // comptes liés protégés
  DB.comptesRecettes.splice(i,1); saveDB(); render();
}
async function saveLogo(){
  const inp=document.getElementById('logoInput');
  if(!inp.files || !inp.files[0]) return alert("Choisissez une image d'abord.");
  const b64=await fileToBase64(inp.files[0]);
  DB.etabInfo[etab()] = DB.etabInfo[etab()]||{};
  DB.etabInfo[etab()].logo = b64;
  saveDB(); render();
}
function updateTarif(el){
  const [f,a]=el.dataset.tk.split('|'); const field=el.dataset.field;
  DB.tarifs[etab()] = DB.tarifs[etab()]||{};
  DB.tarifs[etab()][f] = DB.tarifs[etab()][f]||{};
  DB.tarifs[etab()][f][a] = DB.tarifs[etab()][f][a]||{inscription:0,scolarite:0,materiel:0,uniforme:0};
  DB.tarifs[etab()][f][a][field]=Number(el.value)||0;
  saveDB();
}
function addCompte(){
  const code=document.getElementById('ccCode').value.trim(), lib=document.getElementById('ccLib').value.trim();
  if(!code||!lib) return alert("Code et libellé requis.");
  DB.comptesCharges.push({code,lib}); saveDB(); render();
}
function delCompte(i){ DB.comptesCharges.splice(i,1); saveDB(); render(); }
function saveTaux(){

function addTeacher(){

function csvEscape(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(/[;"\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function exportStudentsCSV(){
  const fFiliere=document.getElementById('fsFiliere').value;
  const fAnnee=document.getElementById('fsAnnee').value;
  const fStatut=document.getElementById('fsStatut').value;
  const fNom=(document.getElementById('fsNom').value||'').trim().toLowerCase();
  const list = DB.students.filter(s=>matchScope(s) &&
    (!fFiliere||s.filiere===fFiliere) && (!fAnnee||s.annee===fAnnee) &&
    (!fStatut||(s.statut||'Actif')===fStatut) &&
    (!fNom||(s.nom+' '+s.prenoms).toLowerCase().includes(fNom)));
  const headers=["Nom","Prénoms","Sexe","NPI","Date de naissance","Ville de naissance","Niveau d'étude","Filière","Classe","Statut","Maladie","Contact apprenant","Parent/tuteur","Contact parent","Adresse parent","Date d'inscription"];
  const rows=list.map(s=>[s.nom,s.prenoms,s.sexe==='F'?'Féminin':s.sexe==='M'?'Masculin':'',s.npi||'',s.ddn||'',s.ville||'',s.niveau||'',s.filiere||'',s.annee||'',s.statut||'Actif',s.maladie||'',s.contactApp||'',s.parent||'',s.contactParent||'',s.adresseParent||'',s.dateInscription||'']);
  const csv = "\uFEFF"+[headers, ...rows].map(r=>r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`apprenants-${etab().replace(/\s+/g,'_')}-${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
function filterStudentsList(){
  const fFiliere=document.getElementById('fsFiliere').value;
  const fAnnee=document.getElementById('fsAnnee').value;
  const fStatut=document.getElementById('fsStatut').value;
  const fNom=(document.getElementById('fsNom').value||'').trim().toLowerCase();
  let count=0;
  document.querySelectorAll('#studentsTable tr[data-filiere]').forEach(tr=>{
    const match = (!fFiliere||tr.dataset.filiere===fFiliere) &&
                  (!fAnnee||tr.dataset.annee===fAnnee) &&

}

/* ================= VUE : PAIEMENTS ================= */
function tarifOf(f,a){
  return (DB.tarifs[etab()]&&DB.tarifs[etab()][f]&&DB.tarifs[etab()][f][a]) || {inscription:0,scolarite:0,materiel:0,uniforme:0};
}
function totalDu(s){
  const t=tarifOf(s.filiere,s.annee);
  return t.inscription+t.scolarite; // matériel/uniforme facultatifs, hors montant attendu de base
}
function paidOf(sid){
  return activePayments().filter(p=>p.studentId===sid).reduce((a,p)=>a+p.montantPaye,0);
}
/* Le "reste à payer" ne concerne que scolarité+inscription (le matériel et
   l'uniforme sont facultatifs et hors montant dû de base) : on cumule donc
   séparément ce qui a été payé au titre de scolarité+inscription, et ce qui
   a été payé au titre matériel+uniforme, ainsi que les réductions accordées. */
function paidScoInscOf(sid, excludeId){
  return activePayments().filter(p=>p.studentId===sid && p.id!==excludeId).reduce((a,p)=>a+(Number(p.insc)||0)+(Number(p.sco)||0),0);
}
function paidMatUniOf(sid, excludeId){
  return activePayments().filter(p=>p.studentId===sid && p.id!==excludeId).reduce((a,p)=>a+(Number(p.mat)||0)+(Number(p.uni)||0),0);
}
function reductionOf(sid, excludeId){
  return activePayments().filter(p=>p.studentId===sid && p.id!==excludeId).reduce((a,p)=>a+(Number(p.reduction)||0),0);
}

  const filtered = list.filter(s=>
    (!fFiliere || s.filiere===fFiliere) &&
    (!fAnnee || s.annee===fAnnee) &&
    (!fNom || (s.nom+' '+s.prenoms).toLowerCase().includes(fNom))
  );
  const sel=document.getElementById('payStudent');
  sel.innerHTML = filtered.length
    ? filtered.map(s=>`<option value="${s.id}">${s.nom} ${s.prenoms} — ${s.filiere} ${s.annee}</option>`).join('')
    : '<option value="">Aucun apprenant trouvé</option>';

function getPayHistoryFiltered(){
  const fil=(document.getElementById('histFiliere')?.value||'').trim();

  const to=document.getElementById('histDateTo')?.value||'';

function doPayment(){
  const sid=document.getElementById('payStudent').value;
  const s=DB.students.find(x=>x.id===sid); if(!s) return;
  const insc=Number(document.getElementById('payInsc').value)||0;
  const sco=Number(document.getElementById('paySco').value)||0;
  const mat=Number(document.getElementById('payMat').value)||0;
  const uni=Number(document.getElementById('payUni').value)||0;
  const red=Number(document.getElementById('payRed').value)||0;
  const mode=document.getElementById('payMode').value;
  const montantPaye = insc+sco+mat+uni;
  if(montantPaye<=0 && red<=0) return alert("Saisissez un montant de paiement ou une réduction.");
  const du = totalDu(s);
  const dejaScoInsc = paidScoInscOf(sid);
  const dejaReduction = reductionOf(sid);
  const resteApres = Math.max(du - (dejaReduction+red) - (dejaScoInsc+insc+sco),0);
  DB.nextQuittance[etab()] = (DB.nextQuittance[etab()]||0)+1;
  const numero = `${etab().replace(/[^A-Z]/g,'').slice(0,4)}-${new Date().getFullYear()}-${String(DB.nextQuittance[etab()]).padStart(4,'0')}`;
  const p={
    id:uid(), etab:etab(), exercice:exercice(), studentId:sid, nomComplet:`${s.nom} ${s.prenoms}`,
    filiere:s.filiere, annee:s.annee, date:todayISO(), numero,
    montantDu:du, montantPaye, insc,sco,mat,uni, reduction:red, mode,
    resteAPayer: resteApres,
    statut: resteApres<=0 ? "Soldé":"Non Soldé"
  };
  DB.payments.push(p); saveDB(); render();
  setTimeout(()=>printQuittance(p.id),50);
}
function annulerPaiement(pid){
  if(!requireView('paiements')) return;
  const p=DB.payments.find(x=>x.id===pid); if(!p||p.annule) return;
  const motif=prompt(`Motif obligatoire de l'annulation de la quittance ${p.numero} :`,'');
  if(motif===null) return;
  const m=motif.trim();
  if(!m) return alert("Le motif d'annulation est obligatoire.");
  if(!confirm(`Confirmer l'annulation de la quittance ${p.numero} ?\n\nMotif : ${m}`)) return;
  p.annule=true; p.dateAnnulation=todayISO(); p.motifAnnulation=m; p.annulePar=currentUser?(currentUser.nom||currentUser.login):'';
  DB.paymentCancellations=DB.paymentCancellations||[];
  DB.paymentCancellations.push({id:uid(),paymentId:p.id,numero:p.numero,date:p.dateAnnulation,motif:m,par:p.annulePar});
  saveDB(); render();
}

function addPersonnelAdmin(){ const nom=document.getElementById('salNom').value.trim(), fonction=document.getElementById('salFonction').value.trim(), base=Number(document.getElementById('salBase').value)||0, primes=Number(document.getElementById('salPrime').value)||0, retenues=Number(document.getElementById('salRetenue').value)||0; if(!nom||base<=0)return alert('Nom et salaire de base obligatoires.'); DB.personnelAdministratif=DB.personnelAdministratif||[]; DB.personnelAdministratif.push({id:uid(),etab:etab(),nom,fonction,salaireBase:base,primes,retenues,actif:true}); saveDB(); render(); }

function annulerSalaire(id){ const s=(DB.salaires||[]).find(x=>x.id===id); if(!s)return; const motif=prompt("Motif obligatoire de l'annulation du paiement de salaire :",''); if(motif===null)return; if(!motif.trim())return alert('Le motif est obligatoire.'); if(!confirm("Confirmer l'annulation du paiement de salaire ?"))return; s.annule=true; s.motifAnnulation=motif.trim(); s.dateAnnulation=todayISO(); s.annulePar=currentUser?(currentUser.nom||currentUser.login):''; saveDB(); render(); }

/* Solde de caisse : encaissements moins toutes les sorties (dépenses,
   vacations payées, dépôts en banque), réutilisé sur Caisse de dépenses
   et sur le Tableau de bord. */
function soldeCaisseActuel(){
  const totalRecettes = DB.payments.filter(p=>matchScope(p)&&!p.annule).reduce((s,p)=>s+p.montantPaye,0);
  const totalChargesAll = DB.charges.filter(matchScope).reduce((s,c)=>s+c.montant,0);
  const totalVacAll = DB.vacations.filter(matchScope).reduce((s,v)=>s+v.heures*v.taux,0);
  const totalDepots = DB.deposits.filter(matchScope).reduce((s,d)=>s+d.montant,0);
  return { totalRecettes, totalChargesAll, totalVacAll, totalDepots, solde: totalRecettes-totalChargesAll-totalVacAll-totalDepots };
}

    </table></div>`;
  html += `<div class="card"><h3>Détail des dépenses (${list.length})</h3>
    <table><tr><th>Date</th><th>Compte</th><th>Motif</th><th>Montant</th><th>Actions</th></tr>
    ${list.slice().reverse().map(c=>`<tr><td>${c.date}</td><td>${c.compte}</td><td>${c.motif}</td><td>${fmt(c.montant)}</td>
      <td><button class="btn small outline" onclick="corrigerCharge('${c.id}')">Modifier</button>
      <button class="btn small danger" onclick="delCharge('${c.id}')">Supprimer</button></td></tr>`).join('')}
    </table></div>`;
  html += `<div id="editChargeZone"></div>`;

  html += `<div class="card"><h3>Brouillard de caisse</h3>
    <p class="note">Récapitulatif chronologique des entrées (encaissements sur quittances) et sorties (dépenses) de caisse, avec solde cumulé, sur la période choisie.</p>
    <div class="toolbar">
      <div><label>Du</label><input type="date" id="bcDebut"></div>
      <div><label>Au</label><input type="date" id="bcFin" value="${todayISO()}"></div>

    </div>
    <div id="brouillardZone"></div>
  </div>`;
  return html;
}
function genBrouillard(){
  const debut=document.getElementById('bcDebut').value || '0000-01-01';
  const fin=document.getElementById('bcFin').value || '9999-12-31';
  const type=document.getElementById('bcType').value;
  const pays = type==='depenses' ? [] : DB.payments.filter(p=>matchScope(p) && !p.annule && p.date>=debut && p.date<=fin);
  const chgs = type==='recettes' ? [] : DB.charges.filter(c=>matchScope(c) && c.date>=debut && c.date<=fin);
  const mvts=[];
  pays.forEach(p=>mvts.push({date:p.date, lib:`Encaissement — Quittance ${p.numero} — ${p.nomComplet}`, entree:p.montantPaye, sortie:0}));
  chgs.forEach(c=>mvts.push({date:c.date, lib:`Dépense ${c.compte} — ${c.motif||''}`, entree:0, sortie:c.montant}));
  mvts.sort((a,b)=>a.date.localeCompare(b.date));
  let solde=0, rows='';
  mvts.forEach(m=>{ solde += m.entree - m.sortie; rows+=`<tr><td>${m.date}</td><td>${m.lib}</td><td>${m.entree?fmt(m.entree):''}</td><td>${m.sortie?fmt(m.sortie):''}</td><td>${fmt(solde)}</td></tr>`; });
  const totalEntree=mvts.reduce((s,m)=>s+m.entree,0);
  const totalSortie=mvts.reduce((s,m)=>s+m.sortie,0);
  const logo=(DB.etabInfo[etab()]&&DB.etabInfo[etab()].logo)?`<img class="logo" src="${DB.etabInfo[etab()].logo}">`:'';
  const typeLabel = type==='recettes'?' — Recettes seules':type==='depenses'?' — Dépenses seules':'';
  const periodeLabel = `du ${document.getElementById('bcDebut').value||'début'} au ${fin}${typeLabel}`;
  const zone=document.getElementById('brouillardZone');
  zone.innerHTML = `<div class="card">
    <div style="overflow:auto">${logo}<h3 style="margin:0">${etab()}</h3>${coordEtab(etab())}<div>Brouillard de caisse — Période ${periodeLabel}</div></div>
    <div style="clear:both"></div>
    <table><tr><th>Date</th><th>Libellé</th><th>Entrée</th><th>Sortie</th><th>Solde</th></tr>
    ${rows || '<tr><td colspan="5">Aucun mouvement sur la période.</td></tr>'}
    <tr><td colspan="2"><b>Totaux</b></td><td><b>${fmt(totalEntree)}</b></td><td><b>${fmt(totalSortie)}</b></td><td><b>${fmt(solde)}</b></td></tr>
    </table>
    ${printFooter()}
  </div>
  <button class="btn no-print" onclick="openPrintPreview('brouillardZone')">Aperçu avant impression</button>`;
  zone.scrollIntoView({behavior:'smooth'});
}
function addCharge(){

/* Impôt sur prestation (AIB) : taux par défaut réglable dans Paramètres,
   et modifiable (ou annulable à 0) à chaque génération d'état. */
function genEtatVacation(){
  const mois=document.getElementById('eMois').value, annee=document.getElementById('eAnnee').value;
  let tauxAIBPct = Number(document.getElementById('eTauxAIB').value);
  if(isNaN(tauxAIBPct) || tauxAIBPct<0) tauxAIBPct = 0;
  const TAUX_AIB = tauxAIBPct/100;
  const list=DB.vacations.filter(v=>matchScope(v)&&v.mois===mois&&v.annee===annee);
  const totalBrut=list.reduce((s,v)=>s+v.heures*v.taux,0);
  const totalAIB=totalBrut*TAUX_AIB;
  const totalNet=totalBrut-totalAIB;
  const contractuels=Array.isArray(DB.contractuelsVacation)?DB.contractuelsVacation.slice(0,2):[];
  const contractuelsActifs=contractuels.filter(c=>c && (c.nom||c.matiere||Number(c.heures)||Number(c.montant)));
  const totalContractuels=contractuelsActifs.reduce((s,c)=>s+(Number(c.montant)||0),0);
  const totalGeneral=totalNet+totalContractuels;
  const zone=document.getElementById('etatVacZone');
  const logo=(DB.etabInfo[etab()]&&DB.etabInfo[etab()].logo)?`<img class="logo" src="${DB.etabInfo[etab()].logo}">`:'';
  const aibColSpan = tauxAIBPct>0;
  zone.innerHTML = `<div class="receipt" id="etatDoc" style="width:277mm">
    <div class="qr" id="qrEtat"></div>
    ${logo}
    <h3>${etab()}</h3>
    ${coordEtab(etab())}
    <div>État de vacation — Période : ${mois} ${annee}</div>
    <table><tr><th>Enseignant</th><th>Matière</th><th>Heures</th><th>Coût horaire</th><th>Montant brut</th>${aibColSpan?`<th>AIB (${tauxAIBPct}%)</th><th>Montant net</th>`:''}<th>Émargement</th></tr>
    ${list.map(v=>{
      const brut=v.heures*v.taux, aib=brut*TAUX_AIB, net=brut-aib;
      return `<tr><td>${v.enseignant}</td><td>${v.matiere||''}</td><td>${v.heures}</td><td>${fmt(v.taux)}</td><td>${fmt(brut)}</td>${aibColSpan?`<td>${fmt(aib)}</td><td>${fmt(net)}</td>`:''}<td style="width:110px"></td></tr>`;
    }).join('')}
    <tr><td colspan="4"><b>TOTAL VACATION (vacataires)</b></td><td><b>${fmt(totalBrut)}</b></td>${aibColSpan?`<td><b>${fmt(totalAIB)}</b></td><td><b>${fmt(totalNet)}</b></td>`:''}<td></td></tr>
    ${contractuelsActifs.map(c=>`<tr>
      <td>${c.nom||'—'} <span class="tag">Contractuel — fixe</span></td><td>${c.matiere||'—'}</td><td>${Number(c.heures)||0}</td><td>—</td><td>${fmt(Number(c.montant)||0)}</td>${aibColSpan?`<td>—</td><td>${fmt(Number(c.montant)||0)}</td>`:''}<td style="width:110px"></td>
    </tr>`).join('')}
    ${contractuelsActifs.length?`<tr><td colspan="4"><b>TOTAL CONTRACTUELS (salaires fixes)</b></td><td><b>${fmt(totalContractuels)}</b></td>${aibColSpan?`<td>—</td><td><b>${fmt(totalContractuels)}</b></td>`:''}<td></td></tr>`:''}
    <tr><td colspan="4"><b>TOTAL GÉNÉRAL</b></td><td><b>${fmt(totalBrut+totalContractuels)}</b></td>${aibColSpan?`<td><b>${fmt(totalAIB)}</b></td><td><b>${fmt(totalGeneral)}</b></td>`:''}<td></td></tr>
    </table>
    <div class="note"><b>Arrêté le présent état à la somme générale ${aibColSpan?'nette':'totale'} de :</b> ${nombreEnLettres(totalGeneral)}.</div>
    <div style="display:flex;justify-content:space-between;margin-top:30px;gap:10px">
      <div style="text-align:center;width:31%"><div style="border-top:1px solid #999;padding-top:4px">${DB.censeurNom?DB.censeurNom:'Le/La censeur(se)'}<br>Censeur (signature)</div></div>
      <div style="text-align:center;width:31%"><div style="border-top:1px solid #999;padding-top:4px">${DB.directeurNom?DB.directeurNom:'Le/La directeur(rice)'}<br>Directeur(rice) (signature)</div></div>
      <div style="text-align:center;width:31%"><div style="border-top:1px solid #999;padding-top:4px">${DB.comptableNom?DB.comptableNom:'Le/La comptable'}<br>Comptable (signature)</div></div>
    </div>
    ${printFooter()}
  </div>
  <button class="btn no-print" onclick="openPrintPreview('etatVacZone')">Aperçu avant impression</button>`;
  makeQR('qrEtat', `${etab()}|VACATION|${mois} ${annee}|VACATAIRES:${totalNet}|CONTRACTUELS:${totalContractuels}|TOTAL_GENERAL:${totalGeneral}`);
  zone.scrollIntoView({behavior:'smooth'});
}

function viewBalanceSeule(){
  const pays = DB.payments.filter(p=>matchScope(p)&&!p.annule);
  const chgs = DB.charges.filter(matchScope);

function profByName(name){ return (DB.teachers||[]).find(t=>t.nom===name || t.id===name) || null; }
function profStatutLabel(t){
  if(!t) return 'Non renseigné';
  const raw=String(t.statut||t.type||'').toLowerCase();
  if(raw.includes('vac')) return 'Vacataire';
  if(raw.includes('contract') || raw.includes('permanent')) return 'Contractuel';
  return t.statut||t.type||'Non renseigné';
}
function dureeHeures(debut,fin){
  if(!debut||!fin) return 0;
  const [h1,m1]=debut.split(':').map(Number), [h2,m2]=fin.split(':').map(Number);
  const mins=(h2*60+m2)-(h1*60+m1);
  return mins>0 ? mins/60 : 0;
}
function formatHeures(h){ return Number.isInteger(h)?String(h):h.toFixed(2).replace('.',','); }
function edtProfSummary(list){
  const map={};
  list.forEach(e=>{
    const t=profByName(e.professeur); const key=e.professeur||'Non renseigné';
    if(!map[key]) map[key]={nom:key,statut:profStatutLabel(t),heures:0,matieres:new Set(),creneaux:0};
    map[key].heures+=dureeHeures(e.heureDebut,e.heureFin); map[key].matieres.add(e.matiere); map[key].creneaux++;
  });
  return Object.values(map).sort((a,b)=>a.nom.localeCompare(b.nom));
}
function edtDailySummary(list){
  const jours=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
  return jours.map(j=>({jour:j,rows:list.filter(e=>e.jour===j).sort((a,b)=>a.heureDebut.localeCompare(b.heureDebut))}));
}

function escAttr(v){ return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function evalsFor(fil,an,mat,per){
  return (DB.evaluations||[]).filter(e=>matchScope(e)&&e.filiere===fil&&e.annee===an&&e.matiere===mat&&e.periode===per).sort((a,b)=>(a.ordre||0)-(b.ordre||0));
}
function ensureEvaluations(fil,an,mat,per){
  if(!mat) return [];
  let ev=evalsFor(fil,an,mat,per);
  const defs=[['Interrogation','Interrogation 1'],['Interrogation','Interrogation 2'],['Devoir','Devoir 1'],['Devoir','Devoir 2']];
  defs.forEach((d,i)=>{
    if(!ev.some(e=>e.type===d[0]&&e.libelle===d[1])){
      DB.evaluations.push({id:uid(),etab:etab(),exercice:exercice(),filiere:fil,annee:an,matiere:mat,periode:per,type:d[0],libelle:d[1],ordre:i+1});
    }
  });
  saveDB();
  return evalsFor(fil,an,mat,per);
}
function addEvaluation(fil,an,mat,per,type){
  const ev=evalsFor(fil,an,mat,per);
  if(type==='Devoir' && ev.filter(e=>e.type==='Devoir').length>=2) return alert('Le bulletin prévoit exactement deux devoirs : Devoir 1 et Devoir 2.');
  const same=ev.filter(e=>e.type===type).length;
  const lib=`${type} ${same+1}`;
  DB.evaluations.push({id:uid(),etab:etab(),exercice:exercice(),filiere:fil,annee:an,matiere:mat,periode:per,type,libelle:lib,ordre:ev.length+1});
  saveDB(); render();
}
function removeEvaluation(id){
  if(!confirm('Supprimer cette évaluation et toutes les notes associées ?')) return;
  DB.notes=(DB.notes||[]).filter(n=>n.evaluationId!==id);
  DB.evaluations=(DB.evaluations||[]).filter(e=>e.id!==id);
  saveDB(); render();
}
function notesForEval(sid,eid){ return (DB.notes||[]).find(n=>matchScope(n)&&n.studentId===sid&&n.evaluationId===eid); }
function noteEvaluation(sid,ev){ const n=notesForEval(sid,ev.id); return n&&Number.isFinite(Number(n.note))?Number(n.note):null; }
function moyenneInterrogations(sid,fil,an,mat,per){
  const vals=evalsFor(fil,an,mat,per).filter(e=>e.type==='Interrogation').map(e=>noteEvaluation(sid,e)).filter(v=>v!==null);
  return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)/100:null;
}
function devoirNote(sid,fil,an,mat,per,num){
  const ev=evalsFor(fil,an,mat,per).find(e=>e.type==='Devoir' && e.libelle===`Devoir ${num}`);
  return ev?noteEvaluation(sid,ev):null;
}
function moyenneTrimestreMatiere(sid,fil,an,mat,per){
  const mi=moyenneInterrogations(sid,fil,an,mat,per), d1=devoirNote(sid,fil,an,mat,per,1), d2=devoirNote(sid,fil,an,mat,per,2);
  if(mi===null||d1===null||d2===null) return null;
  return Math.round(((mi+d1+d2)/3)*100)/100;
}
function moyenneTrimestreGenerale(sid,fil,an,per){
  const mats=matieresOf(fil); const rows=mats.map(m=>({moy:moyenneTrimestreMatiere(sid,fil,an,m.nom,per),coef:Number(m.coef)||1})).filter(r=>r.moy!==null);
  const tc=rows.reduce((a,r)=>a+r.coef,0), tp=rows.reduce((a,r)=>a+r.moy*r.coef,0);
  return tc?Math.round(tp/tc*100)/100:null;
}
function moyenneAnnuelle(sid,fil,an){
  const vals=periodesActives().map(p=>moyenneTrimestreGenerale(sid,fil,an,p)).filter(v=>v!==null);
  return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)/100:null;
}
function moyenneAnnuelleMatiere(sid,fil,an,mat){
  const vals=periodesActives().map(p=>moyenneTrimestreMatiere(sid,fil,an,mat,p)).filter(v=>v!==null);
  return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)/100:null;
}
function saveMultiNotes(fil,an,mat,per){
  const ev=evalsFor(fil,an,mat,per);
  const students=DB.students.filter(s=>matchScope(s)&&s.filiere===fil&&s.annee===an&&s.statut!=='Abandon');
  students.forEach(s=>ev.forEach(e=>{
    const inp=document.getElementById(`note_${s.id}_${e.id}`); if(!inp)return;
    const val=inp.value.trim(); const idx=DB.notes.findIndex(n=>matchScope(n)&&n.studentId===s.id&&n.evaluationId===e.id);
    if(val===''){ if(idx>=0)DB.notes.splice(idx,1); return; }
    const note=Math.max(0,Math.min(20,Number(val))); if(!Number.isFinite(note))return;
    const coef=(matieresOf(fil).find(m=>m.nom===mat)||{}).coef||1;
    if(idx>=0) Object.assign(DB.notes[idx],{note,coef,filiere:fil,annee:an,matiere:mat,periode:per});
    else DB.notes.push({id:uid(),etab:etab(),exercice:exercice(),studentId:s.id,filiere:fil,annee:an,matiere:mat,periode:per,evaluationId:e.id,note,coef});
  }));
  saveDB(); render();
}

  const classAvg=classVals.length?Math.round(classVals.reduce((a,x)=>a+x.moy,0)/classVals.length*100)/100:null;
  const profs=[...new Set(subjectRows.map(r=>r.prof).filter(Boolean))].map(prof=>{const rs=subjectRows.filter(r=>r.prof===prof&&r.avg!==null);return {prof,matieres:rs.length,moy:rs.length?Math.round(rs.reduce((a,r)=>a+r.avg,0)/rs.length*100)/100:null,forte:rs.length?Math.max(...rs.map(r=>r.avg)):null,faible:rs.length?Math.min(...rs.map(r=>r.avg)):null};});
  let html=`<div class="card"><h3>Conseil des professeurs — Statistiques pédagogiques</h3><p class="note"><b>Règle :</b> moyenne de chaque période à partir des interrogations et devoirs ; moyenne annuelle = somme des moyennes des périodes ÷ nombre de périodes (3 trimestres ou 2 semestres).</p><div class="grid3"><div><label>Filière</label><select onchange="pedaFiliere=this.value;render()">${filieresOf().map(f=>`<option ${f===fil?'selected':''}>${f}</option>`).join('')}</select></div><div><label>Classe</label><select onchange="pedaAnnee=this.value;render()">${DB.annees.map(a=>`<option ${a===an?'selected':''}>${a}</option>`).join('')}</select></div><div><label>${libellePeriodeSingulier()}</label><select onchange="pedaPeriode=this.value;render()">${periodesActives().map(p=>`<option ${p===per?'selected':''}>${p}</option>`).join('')}</select></div></div></div>`;
  html+=`<div class="card"><h3>Vue de la classe</h3><div class="grid3"><div><b>Effectif :</b> ${students.length}</div><div><b>Moyenne de classe :</b> ${classAvg??'—'} /20</div><div><b>Élèves notés :</b> ${classVals.length}</div></div><table><tr><th>Rang</th><th>Apprenant</th><th>Moy. ${per}</th><th>Moy. annuelle</th></tr>${classVals.map((x,i)=>`<tr><td>${i+1}</td><td>${x.s.nom} ${x.s.prenoms}</td><td>${x.moy}</td><td>${x.ann??'—'}</td></tr>`).join('')||'<tr><td colspan="4">Aucune note enregistrée.</td></tr>'}</table></div>`;
  html+=`<div class="card"><h3>Analyse par matière</h3><div style="overflow:auto"><table><tr><th>Matière</th><th>Professeur</th><th>Coef.</th><th>Effectif</th><th>Moy. classe</th><th>Plus forte moyenne</th><th>Apprenant avec plus forte moyenne</th><th>Plus faible moyenne</th><th>Plus faible apprenant</th></tr>${subjectRows.map(r=>`<tr><td><b>${r.matiere}</b></td><td>${r.prof}</td><td>${r.coef}</td><td>${r.effectif}</td><td>${r.avg??'—'}</td><td>${r.max?r.max.moy:'—'}</td><td>${r.max?r.max.s.nom+' '+r.max.s.prenoms:'—'}</td><td>${r.min?r.min.moy:'—'}</td><td>${r.min?r.min.s.nom+' '+r.min.s.prenoms:'—'}</td></tr>`).join('')||'<tr><td colspan="9">Aucune matière configurée.</td></tr>'}</table></div></div>`;
  html+=`<div class="card"><h3>Indicateurs descriptifs des professeurs</h3><p class="note">Ces indicateurs synthétisent les résultats des apprenants dans les matières attribuées aux enseignants ; ils ne constituent pas une évaluation administrative.</p><table><tr><th>Professeur</th><th>Matières suivies</th><th>Moyenne des matières</th><th>Plus forte moyenne</th><th>Plus faible moyenne</th></tr>${profs.map(p=>`<tr><td>${p.prof}</td><td>${p.matieres}</td><td>${p.moy??'—'}</td><td>${p.forte??'—'}</td><td>${p.faible??'—'}</td></tr>`).join('')||'<tr><td colspan="5">Renseignez les enseignants dans l’emploi du temps.</td></tr>'}</table></div>`;
  const printable=`<div class="card" id="syntheseDoc"><h3>${etab()} — Conseil des professeurs</h3><div>${fil} — ${an} — ${per} — Exercice ${exercice()}</div><p><b>Effectif :</b> ${students.length} &nbsp; <b>Moyenne classe :</b> ${classAvg??'—'}/20 &nbsp; <b>Élèves notés :</b> ${classVals.length}</p><table><tr><th>Matière</th><th>Professeur</th><th>Moyenne</th><th>Plus forte</th><th>Plus faible</th></tr>${subjectRows.map(r=>`<tr><td>${r.matiere}</td><td>${r.prof}</td><td>${r.avg??'—'}</td><td>${r.max?r.max.moy+' — '+r.max.s.nom:'—'}</td><td>${r.min?r.min.moy+' — '+r.min.s.nom:'—'}</td></tr>`).join('')}</table><h4>Classement de la classe</h4><table><tr><th>Rang</th><th>Apprenant</th><th>${libellePeriodeSingulier()}</th><th>Annuel</th></tr>${classVals.map((x,i)=>`<tr><td>${i+1}</td><td>${x.s.nom} ${x.s.prenoms}</td><td>${x.moy}</td><td>${x.ann??'—'}</td></tr>`).join('')}</table>${printFooter()}</div>`;
  html+=`<div class="toolbar"><button class="btn" onclick="openPrintPreview('syntheseZone')">Aperçu / imprimer la synthèse</button></div><div id="syntheseZone">${printable}</div>`;
  return html;
}

function seedDemoPedagogy(){
  if(!DB || !Array.isArray(DB.evaluations)) return;
  const demoStudents=(DB.students||[]).filter(s=>s.id&&String(s.id).startsWith('demo-stu-'));
  if(!demoStudents.length) return;
  // Matières et enseignants de démonstration, proches du bulletin fourni.
  DB.matieres=DB.matieres||{}; DB.matieres['CPET NDL']=DB.matieres['CPET NDL']||{};
  if(!DB.matieres['CPET NDL'].F3?.length) DB.matieres['CPET NDL'].F3=[{nom:'MATHS GÉNÉ',coef:1},{nom:'ANGLAIS',coef:1},{nom:'SVT',coef:1},{nom:'PCT',coef:1},{nom:'HIST-GEO',coef:1},{nom:'RELIGION',coef:1},{nom:'FRANÇAIS COM. ÉCRITE',coef:1},{nom:'FRANÇAIS LECTURE',coef:1},{nom:'CONDUITE',coef:1}];
  DB.teachers=DB.teachers||[];
  DB.teachers.forEach(t=>{ if(String(t.type||'').toLowerCase()==='permanent' && !t.statut) { t.statut='contractuel'; t.type='contractuel'; } else if(!t.statut) t.statut=t.type||'vacataire'; });
  const demoTeach=['M. AGBODJINOU','Mme ADJINAKOU','M. KORA','Mme HOUNKPATIN']; demoTeach.forEach((nom,i)=>{if(!DB.teachers.some(t=>t.nom===nom))DB.teachers.push({id:'demo-prof-'+i,nom,type:(i%2===0?'contractuel':'vacataire'),statut:(i%2===0?'contractuel':'vacataire'),matiere:'',taux:0});});
  DB.emploiDuTemps=DB.emploiDuTemps||[]; const matProf=DB.matieres['CPET NDL'].F3||[]; matProf.forEach((m,i)=>{const prof=DB.teachers[i%DB.teachers.length]; if(prof && !DB.emploiDuTemps.some(e=>e.etab==='CPET NDL'&&e.exercice===exercice()&&e.filiere==='F3'&&e.annee==='2nde'&&e.matiere===m.nom)) DB.emploiDuTemps.push({id:'demo-edt-'+i,etab:'CPET NDL',exercice:exercice(),filiere:'F3',annee:'2nde',jour:['Lundi','Mardi','Mercredi','Jeudi','Vendredi'][i%5],heureDebut:'08:00',heureFin:'10:00',matiere:m.nom,professeur:prof.nom}); });
  const extraEdt=[['Lundi','10:00','12:00','ANGLAIS',0],['Lundi','14:00','16:00','PCT',1],['Mardi','08:00','10:00','MATHS GÉNÉ',2],['Mardi','10:00','12:00','SVT',3],['Mercredi','08:00','10:00','HIST-GEO',0],['Mercredi','10:00','12:00','RELIGION',1],['Jeudi','08:00','10:00','FRANÇAIS COM. ÉCRITE',2],['Jeudi','10:00','12:00','FRANÇAIS LECTURE',3],['Vendredi','08:00','10:00','CONDUITE',0],['Vendredi','10:00','12:00','MATHS GÉNÉ',2]]; extraEdt.forEach((x,i)=>{const prof=DB.teachers[x[4]]; if(prof && !DB.emploiDuTemps.some(e=>e.id==='demo-extra-edt-'+i)) DB.emploiDuTemps.push({id:'demo-extra-edt-'+i,etab:'CPET NDL',exercice:exercice(),filiere:'F3',annee:'2nde',jour:x[0],heureDebut:x[1],heureFin:x[2],matiere:x[3],professeur:prof.nom,statutProfesseur:profStatutLabel(prof)}); });
  const stu=demoStudents[0]; const fil=stu.filiere||'F3', an=stu.annee||'2nde';
  const mats=(DB.matieres['CPET NDL']&&DB.matieres['CPET NDL'][fil])||[];
  const base=[[10,8,10,12],[13.5,8.5,10,11],[13.5,6,4,9],[13.5,7,7,10],[12.5,14,15,13],[12,12,12,12],[8.5,6,8,9],[10,7.5,8,11],[17,17,17,18]];
  mats.forEach((m,mi)=>periodesActives().forEach((per,pi)=>{let ev=evalsFor(fil,an,m.nom,per); if(!ev.length){[['Interrogation','Interrogation 1'],['Interrogation','Interrogation 2'],['Devoir','Devoir 1'],['Devoir','Devoir 2']].forEach((d,i)=>DB.evaluations.push({id:'demo-ev-'+mi+'-'+pi+'-'+i,etab:'CPET NDL',exercice:exercice(),filiere:fil,annee:an,matiere:m.nom,periode:per,type:d[0],libelle:d[1],ordre:i+1})); ev=evalsFor(fil,an,m.nom,per);} const vals=base[mi%base.length].map(v=>Math.max(0,Math.min(20,v+(pi===1?0.5:pi===2?-0.25:0)))); ev.forEach((e,ei)=>{if(!DB.notes.some(n=>n.studentId===stu.id&&n.evaluationId===e.id))DB.notes.push({id:'demo-note-'+mi+'-'+pi+'-'+ei,etab:'CPET NDL',exercice:exercice(),studentId:stu.id,filiere:fil,annee:an,matiere:m.nom,periode:per,evaluationId:e.id,note:vals[ei%vals.length],coef:m.coef});});}));
  // Give the two other demo students enough data for class statistics.
  demoStudents.filter(st=>st.id!==stu.id && st.etab===etab() && st.filiere===fil && st.annee===an).forEach((st,si)=>{ const sf=st.filiere||fil, sa=st.annee||an; const smats=(DB.matieres[sf]&&DB.matieres[sf][sa])||mats; smats.slice(0,4).forEach((m,mi)=>periodesActives().forEach((per,pi)=>{let ev=evalsFor(sf,sa,m.nom,per); if(!ev.length){[['Interrogation','Interrogation 1'],['Interrogation','Interrogation 2'],['Devoir','Devoir 1'],['Devoir','Devoir 2']].forEach((d,i)=>DB.evaluations.push({id:uid(),etab:st.etab,exercice:exercice(),filiere:sf,annee:sa,matiere:m.nom,periode:per,type:d[0],libelle:d[1],ordre:i+1}));ev=evalsFor(sf,sa,m.nom,per);} ev.forEach((e,ei)=>{if(!DB.notes.some(n=>n.studentId===st.id&&n.evaluationId===e.id))DB.notes.push({id:uid(),etab:st.etab,exercice:exercice(),studentId:st.id,filiere:sf,annee:sa,matiere:m.nom,periode:per,evaluationId:e.id,note:Math.max(0,Math.min(20,10+si*2+mi-ei+pi)),coef:m.coef});});})); });
  saveDB();
}

function viewCantine(){
  let html = head("Cantine & Internat", "var(--mod-cantine)");
  const tarifs = DB.cantineTarifs[etab()] || {cantine:0, internat:0};
  html += `<div class="card"><h3>Tarifs mensuels — ${etab()}</h3>
    <div class="grid2">
      <div><label>Cantine (FCFA/mois)</label><input type="number" id="ctCantine" value="${tarifs.cantine||0}"></div>
      <div><label>Internat (FCFA/mois)</label><input type="number" id="ctInternat" value="${tarifs.internat||0}"></div>
    </div>
    <button class="btn small" style="margin-top:8px" onclick="saveCantineTarifs()">Enregistrer les tarifs</button>
  </div>`;

  const students = DB.students.filter(s=>matchScope(s)&&s.statut!=='Abandon');
  html += `<div class="card"><h3>Inscription cantine / internat</h3>
    <label>Apprenant</label><select id="ciStudent">${students.map(s=>`<option value="${s.id}">${s.nom} ${s.prenoms} — ${s.filiere} ${s.annee}</option>`).join('')}</select>

      <div><label><input type="checkbox" id="ciCantine"> Inscrit à la cantine</label></div>
      <div><label><input type="checkbox" id="ciInternat"> Inscrit à l'internat</label></div>
    </div>
    <button class="btn small" style="margin-top:8px" onclick="saveCantineInscription()">Enregistrer l'inscription</button>
  </div>`;

  const inscrits = DB.cantineInscriptions.filter(i=>matchScope(i)&&(i.cantine||i.internat));
  html += `<div class="card"><h3>Apprenants inscrits (${inscrits.length})</h3>
    <table><tr><th>Apprenant</th><th>Cantine</th><th>Internat</th></tr>
    ${inscrits.map(i=>{const s=DB.students.find(x=>x.id===i.studentId); return s?`<tr><td>${s.nom} ${s.prenoms}</td><td>${i.cantine?'✔️':'—'}</td><td>${i.internat?'✔️':'—'}</td></tr>`:'';}).join('') || '<tr><td colspan="3">Aucun apprenant inscrit pour le moment.</td></tr>'}
    </table></div>`;

  html += `<div class="card"><h3>Enregistrer un paiement</h3>
    <div class="grid3">
      <div><label>Apprenant</label><select id="cpStudent">${inscrits.map(i=>{const s=DB.students.find(x=>x.id===i.studentId); return s?`<option value="${s.id}">${s.nom} ${s.prenoms}</option>`:'';}).join('') || '<option value="">Aucun apprenant inscrit</option>'}</select></div>
      <div><label>Type</label><select id="cpType"><option value="Cantine">Cantine</option><option value="Internat">Internat</option></select></div>
      <div><label>Mois concerné</label><select id="cpMois">${["Septembre","Octobre","Novembre","Décembre","Janvier","Février","Mars","Avril","Mai","Juin"].map(m=>`<option>${m}</option>`).join('')}</select></div>
    </div>
    <div class="grid2">
      <div><label>Montant</label><input type="number" id="cpMontant" value="${tarifs.cantine||0}"></div>
      <div><label>Mode</label><select id="cpMode"><option>Espèces</option><option>MTN MoMo</option><option>Chèque</option><option>Virement</option></select></div>
    </div>
    <button class="btn" style="margin-top:10px" onclick="addCantinePaiement()">Enregistrer le paiement</button>
  </div>`;

  const pays = DB.cantinePaiements.filter(matchScope).slice().reverse();
  const totalCantine = pays.filter(p=>p.type==='Cantine').reduce((s,p)=>s+p.montant,0);
  const totalInternat = pays.filter(p=>p.type==='Internat').reduce((s,p)=>s+p.montant,0);
  html += `<div class="card"><h3>Historique — Cantine : ${fmt(totalCantine)} FCFA · Internat : ${fmt(totalInternat)} FCFA</h3>
    <table><tr><th>Date</th><th>Apprenant</th><th>Type</th><th>Mois</th><th>Montant</th><th>Mode</th><th></th></tr>
    ${pays.map(p=>`<tr><td>${p.date}</td><td>${p.nomComplet}</td><td>${p.type}</td><td>${p.mois}</td><td>${fmt(p.montant)}</td><td>${p.mode}</td><td><button class="btn small danger" onclick="delCantinePaiement('${p.id}')">Supprimer</button></td></tr>`).join('') || '<tr><td colspan="7">Aucun paiement enregistré.</td></tr>'}
    </table></div>`;
  return html;
}
function saveCantineTarifs(){
  DB.cantineTarifs[etab()] = {cantine:Number(document.getElementById('ctCantine').value)||0, internat:Number(document.getElementById('ctInternat').value)||0};
  saveDB(); render();
}
function saveCantineInscription(){
  const sid=document.getElementById('ciStudent').value; if(!sid) return;
  const cantine=document.getElementById('ciCantine').checked;
  const internat=document.getElementById('ciInternat').checked;
  let rec = DB.cantineInscriptions.find(i=>matchScope(i)&&i.studentId===sid);
  if(rec){ rec.cantine=cantine; rec.internat=internat; }
  else { DB.cantineInscriptions.push({id:uid(),etab:etab(),exercice:exercice(),studentId:sid,cantine,internat}); }
  saveDB(); render();
}
function addCantinePaiement(){
  const sid=document.getElementById('cpStudent').value;
  const s=DB.students.find(x=>x.id===sid); if(!s) return alert("Aucun apprenant inscrit à la cantine/internat.");
  const type=document.getElementById('cpType').value;
  const mois=document.getElementById('cpMois').value;
  const montant=Number(document.getElementById('cpMontant').value)||0;
  const mode=document.getElementById('cpMode').value;
  if(montant<=0) return alert("Montant invalide.");
  DB.cantinePaiements.push({id:uid(),etab:etab(),exercice:exercice(),studentId:sid,nomComplet:`${s.nom} ${s.prenoms}`,type,mois,annee:new Date().getFullYear(),montant,mode,date:todayISO()});
  saveDB(); render();
}
function delCantinePaiement(id){
  if(!confirm("Supprimer définitivement ce paiement cantine/internat ?")) return;
  DB.cantinePaiements = DB.cantinePaiements.filter(x=>x.id!==id);
  saveDB(); render();
}

/* ================= LIAISON CENSORAT ↔ COMPTABILITÉ ================= */
function lanCfg(){ DB.lan=DB.lan||{mode:'desactive',serverUrl:'http://192.168.50.1:47821',key:'GZ-LIAISON-2026',autoSync:true}; return DB.lan; }
async function startLanServer(){ if(!window.electronAPI||!window.electronAPI.lan)return alert('Fonction réseau disponible uniquement dans la version Electron.'); const c=lanCfg(); const r=await window.electronAPI.lan.startServer({port:47821,key:c.key}); if(!r.ok)return alert(r.error||'Impossible de démarrer la liaison.'); c.mode='serveur'; saveDB(); await window.electronAPI.lan.setStudents(DB.students.filter(s=>s.statut!=='Abandon')); render(); alert(`Serveur de liaison actif.\nAdresse(s) détectée(s) : ${(r.addresses||[]).join(', ')||'aucune'}\nPort : ${r.port}\n\nSur le PC du censorat, utilisez l'adresse de ce PC, par exemple http://192.168.50.1:${r.port}`); }
async function stopLanServer(){ if(window.electronAPI&&window.electronAPI.lan){await window.electronAPI.lan.stopServer();} lanCfg().mode='desactive'; saveDB(); render(); }
async function publishStudentsToLan(){ const c=lanCfg(); if(window.electronAPI&&window.electronAPI.lan&&c.mode==='serveur') return window.electronAPI.lan.setStudents(DB.students.filter(s=>s.statut!=='Abandon')); if(c.mode==='client'&&window.electronAPI&&window.electronAPI.lan) return window.electronAPI.lan.pushStudents({url:c.serverUrl+'/students',key:c.key,students:DB.students.filter(s=>s.source==='censorat'||s.source==='censorat-local')}); return {ok:false,error:'Liaison inactive'}; }
function mergeCensorStudents(incoming){ if(!Array.isArray(incoming))return 0; let added=0,updated=0; incoming.forEach(src=>{ if(!src||!src.nom||!src.prenoms)return; let local=src.syncId?DB.students.find(s=>s.syncId===src.syncId):null; if(!local&&src.npi) local=DB.students.find(s=>s.npi&&s.npi===src.npi&&s.etab===etab()&&s.exercice===src.exercice); if(!local){ const copy={...src,id:uid(),syncId:src.syncId||uid(),source:'censorat'}; DB.students.push(copy); added++; } else { const keep={...local}; Object.assign(local,{...src,id:keep.id,syncId:keep.syncId||src.syncId,source:local.source||'censorat'}); updated++; } }); if(added||updated){ saveDB(); } return added+updated; }
async function syncFromCensorat(){ if(!window.electronAPI||!window.electronAPI.lan)return; const c=lanCfg(); let r; if(c.mode==='serveur'){ r=await window.electronAPI.lan.getStudents(); } else if(c.mode==='client'){ r=await window.electronAPI.lan.pullStudents({url:c.serverUrl+'/students',key:c.key}); } else return; const status=document.getElementById('lanStatus'); if(!r||!r.ok){if(status)status.textContent='❌ '+(r&&r.error||'Liaison indisponible');return;} const count=mergeCensorStudents(r.students||[]); if(status)status.textContent=`✅ Liaison active — ${(r.students||[]).length} fiche(s) disponibles${count?` — ${count} synchronisation(s)`:''}`; if(count) render(); }
async function configureLanClient(){ const c=lanCfg(); const url=document.getElementById('lanServerUrl').value.trim().replace(/\/$/,''); const key=document.getElementById('lanKey').value.trim(); if(!url||!key)return alert('Adresse du PC comptable et clé obligatoires.'); c.mode='client'; c.serverUrl=url; c.key=key; saveDB(); const r=await window.electronAPI.lan.pullStudents({url:url+'/health',key}); if(!r.ok){document.getElementById('lanStatus').textContent='❌ Connexion impossible : '+r.error;return;} await syncFromCensorat(); render(); }
async function testLan(){ const c=lanCfg(); if(c.mode==='serveur'){ const r=await window.electronAPI.lan.info(); document.getElementById('lanStatus').textContent=r.running?`✅ Serveur actif sur ${r.addresses.join(', ')||'adresse locale'}:${r.port}`:'Serveur arrêté'; } else if(c.mode==='client'){ await syncFromCensorat(); } }
function viewLiaison(){ const c=lanCfg(); const isC=userRole()==='censeur', isComp=userRole()==='comptable'; let html=head('Liaison Censorat ↔ Comptabilité','var(--mod-tresorerie)'); html+=`<div class="card"><h3>Synchronisation locale par câble</h3><p>Le câble relie les deux PC en réseau local. Le PC de comptabilité héberge le service de liaison ; le PC du censorat envoie les nouveaux inscrits. Seules les données d'inscription nécessaires à la scolarité sont synchronisées, pas les données financières.</p><p class="note"><b>Important :</b> il faut configurer une adresse IPv4 fixe sur les deux PC et autoriser le port 47821 dans le pare-feu Windows.</p>`; if(isComp||userRole()==='admin') html+=`<hr><h3>PC COMPTABILITÉ — serveur</h3><p>Adresse(s) du PC : utilisez l'adresse IPv4 du câble Ethernet, par exemple <b>192.168.50.1</b>.</p><button class="btn" onclick="startLanServer()">Démarrer le serveur de liaison</button> <button class="btn danger" onclick="stopLanServer()">Arrêter</button>`; if(isC||userRole()==='admin') html+=`<hr><h3>PC CENSORAT — client</h3><label>Adresse du PC comptabilité</label><input id="lanServerUrl" value="${c.serverUrl||'http://192.168.50.1:47821'}" placeholder="http://192.168.50.1:47821"><label>Clé de liaison</label><input id="lanKey" value="${c.key||'GZ-LIAISON-2026'}" type="password"><button class="btn" onclick="configureLanClient()">Enregistrer et tester la liaison</button>`; html+=`<p id="lanStatus" style="margin-top:12px;font-weight:600"></p></div>`; return html; }
setInterval(()=>{ if(DB&&currentUser&&(lanCfg().mode==='client'||lanCfg().mode==='serveur')&&lanCfg().autoSync) syncFromCensorat(); },10000);
